# Shared infrastructure for Agent HQ: run once, on one host.
#   cd deploy/infra && cp .env.example .env && docker compose up -d
#
# Postgres and Valkey always start. The Mosquitto broker is optional (profile "mqtt"):
#   - Using your home lab's existing broker: leave it off and point AHQ_MQTT_URL there.
#   - Want a local broker for dev/testing: set COMPOSE_PROFILES=mqtt in .env,
#     or run `docker compose --profile mqtt up -d`.
name: agent-hq-infra

services:
  postgres:
    # Postgres 17 with the pgvector extension, used by long-term memory.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_hq
      POSTGRES_USER: agent_hq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["./postgres:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    # AOF persistence so queued jobs survive a restart; never evict stream entries.
    command: >
      valkey-server --appendonly yes --appendfsync everysec
      --maxmemory-policy noeviction --requirepass ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    volumes: ["./valkey:/data"]
    ports: ["6379:6379"]

  mosquitto:
    # Optional local broker; only starts with the "mqtt" profile (see the top of this file).
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    ports: ["1883:1883"]
