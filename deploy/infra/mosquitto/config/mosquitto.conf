# Create the password file once:
#   docker compose run --rm mosquitto mosquitto_passwd -c /mosquitto/config/passwd agent-hq
# Add more users (Zabbix, Home Assistant, scripts) without -c.
listener 1883
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /mosquitto/config/passwd

# Optional TLS with a certificate from your own CA (e.g. step-ca):
# listener 8883
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# cafile   /mosquitto/config/certs/root_ca.crt
