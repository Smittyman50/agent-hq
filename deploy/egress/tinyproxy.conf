# Egress proxy for the workbenches: they have no network of their own, and this proxy
# only lets them reach the hosts in /etc/tinyproxy/allowlist (PyPI by default).
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 50
LogLevel Info
# Only hosts matching a line in the allowlist; everything else gets 403.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive No
# HTTPS is tunnelled with CONNECT; only to port 443.
ConnectPort 443
# Only containers on the workbench network can use it.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 127.0.0.1
