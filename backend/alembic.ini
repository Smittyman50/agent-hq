# For running the alembic CLI from backend/ during development. The app itself does not
# read this file: app/migrate.py builds the same configuration in code, and the database
# URL always comes from AHQ_DB_URL / AHQ_DATA_DIR (see app/migrations/env.py).
# Prefer `python -m app.migrate ...`, which also takes the migration lock.
[alembic]
script_location = app:migrations
file_template = %%(rev)s_%%(slug)s
