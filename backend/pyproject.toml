[project]
name = "agent-hq"
version = "0.1.0"
description = "Self-hosted multi-agent system: data-defined agents, MCP tools, reliable delegation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-ai-slim[openai,anthropic,mcp]>=2.66",
  "fastmcp>=2.0",
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "aiosqlite>=0.20",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.2",
  "croniter>=6",                # schedules
  "tzdata",                     # time zones for schedules, even on slim images
  "aiomqtt>=2.3",
  "pillow>=10",
  "argon2-cffi>=23",            # password hashing
  "segno>=1.6",                 # QR code for setting up two-factor sign-in
  "python-multipart>=0.0.9",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "openinference-instrumentation-pydantic-ai>=0.1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "amqtt>=0.11",
       # for tests/test_webreader.py (the web-reader server runs in its own container)
       "fastmcp>=2", "feedparser", "trafilatura"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
agent-hq-worker = "app.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]
