# Agent HQ application: API/UI + workers (+ an example agent desktop).
# Needs the shared infrastructure in deploy/infra (Postgres, Valkey, Mosquitto).
#   cp .env.example .env   # set AHQ_DB_URL, AHQ_REDIS_URL, AHQ_MQTT_URL, model keys
#   docker compose up -d --build
#
# Workers can also run on other machines: copy this file there and keep only the
# worker services you want on that host (same image, same .env).
name: agent-hq

x-app: &app
  build: .
  restart: unless-stopped
  env_file: [.env]
  # The host's name, for readable worker names like worker-shockwave-7090. (Or set
  # AHQ_HOST_NAME in .env, e.g. on Docker Desktop, where this file doesn't exist.)
  volumes: ["/etc/hostname:/etc/host_hostname:ro"]
  # "workbench" lets workers (and the API, to list tools) reach the agents' workbenches.
  networks: [default, workbench]

services:
  hq:
    <<: *app
    # Plain HTTP for this host only by default: browse through https via the caddy service.
    # Set AHQ_HTTP_BIND=8000 in .env to reach it over the network without HTTPS.
    ports: ["${AHQ_HTTP_BIND:-127.0.0.1:8000}:8000"]
    environment:
      AHQ_CORS_ORIGINS: http://localhost:4200
      AHQ_WORKER_PREFIX: hq
      # Your step-ca root, so the knowledge library trusts your Gitea and internal sites
      # over HTTPS (the same root_ca.crt the caddy service uses).
      AHQ_EXTRA_CA_FILE: /etc/agent-hq/caddy/root_ca.crt
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
      - hq-data:/data                          # knowledge library: uploads, repo clones
      - ./deploy/caddy:/etc/agent-hq/caddy:ro

  # General-purpose worker: runs agents whose pool is "default".
  worker:
    <<: *app
    command: ["python", "-m", "app.worker", "--pools", "default", "--concurrency", "4"]
    # No fixed AHQ_WORKER_NAME, so replicas stay unique: each is named
    # worker-<host>-<last 4 of its container ID>, e.g. worker-shockwave-7090.
    environment:
      AHQ_WORKER_PREFIX: worker
    deploy:
      replicas: 1          # raise for more parallel agent runs

  # Worker for agents that drive the desktop below (set those agents' pool to "desktop").
  # Runs on the same host, so it can reach http://desktop-1:8765/mcp on this network.
  worker-desktop:
    <<: *app
    command: ["python", "-m", "app.worker", "--pools", "desktop", "--concurrency", "1"]
    environment:
      AHQ_WORKER_NAME: worker-desktop

  # Text-only web tools: RSS/Atom feeds, readable pages, and search via your SearXNG.
  # Register in the UI (Settings -> Tools): HTTP, http://web-reader:8800/mcp, untick
  # "Prefix tool names", leave "Controls an agent desktop" unticked.
  web-reader:
    build: ./webreader
    restart: unless-stopped
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-}                     # e.g. http://searxng.home.arpa:8888
      WEBREADER_ALLOW_HOSTS: ${WEBREADER_ALLOW_HOSTS:-}   # internal hosts agents may read
      WEBREADER_MAX_CHARS: ${WEBREADER_MAX_CHARS:-12000}

  # Outbound MQTT: agents publish their status and allow-listed commands to your broker.
  # Register in the UI (Settings -> Tools): HTTP, http://mqtt-publisher:8810/mcp, untick
  # "Prefix tool names", leave "Controls an agent desktop" unticked. `publish` asks you first.
  mqtt-publisher:
    build: ./mqttpublisher
    restart: unless-stopped
    environment:
      MQTT_PUBLISH_URL: ${MQTT_PUBLISH_URL:-}                       # its own broker user, with write access
      MQTT_PUBLISH_ALLOW: ${MQTT_PUBLISH_ALLOW:-agent-hq/agents/#}  # topics `publish` may use
      MQTT_PUBLISH_DENY: ${MQTT_PUBLISH_DENY:-agent-hq/notifications/#}
      MQTT_PUBLISH_STATUS_PREFIX: ${MQTT_PUBLISH_STATUS_PREFIX:-agent-hq/agents}
      MQTT_PUBLISH_RATE_PER_MINUTE: ${MQTT_PUBLISH_RATE_PER_MINUTE:-30}
      MQTT_PUBLISH_CA_FILE: ${MQTT_PUBLISH_CA_FILE:-}                # e.g. /certs/root_ca.crt for mqtts://
    # For mqtts:// with your step-ca, mount the root certificate:
    # volumes:
    #   - ./deploy/caddy/root_ca.crt:/certs/root_ca.crt:ro

  # HTTPS for the UI (certificate from your step-ca) and sign-in-protected desktop viewers.
  # Setup: deploy/caddy/Caddyfile and the README's "HTTPS" section.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      AHQ_SITE: ${AHQ_SITE:-}
      ACME_CA: ${ACME_CA:-}
      ACME_EMAIL: ${ACME_EMAIL:-admin@home.arpa}   # any address; step-ca sends no mail
    volumes:
      - ./deploy/caddy:/etc/caddy:ro     # Caddyfile + your root_ca.crt
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [hq]

  # One service per agent desktop. Copy this block (desktop-2, SUBFOLDER /desktops/desktop-2/)
  # to add more; the name must be desktop-<number> for the viewer route.
  # In the UI, register two HTTP tool servers (tick "Controls an agent desktop" on both):
  #   http://desktop-1:8765/mcp   screenshots, mouse, keyboard
  #   http://desktop-1:8931/mcp   the desktop's Chromium via Playwright (untick "Prefix tool names")
  # tick them on the agent, and set its desktop viewer URL to /desktops/desktop-1/.
  # No published ports: you reach the viewer only through caddy, signed in to Agent HQ.
  desktop-1:
    build: ./desktop
    restart: unless-stopped
    shm_size: "1gb"
    volumes: ["./desktops/desktop-1:/config"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      SUBFOLDER: /desktops/desktop-1/   # must match the service name

  # An agent's workbench: its own persistent Python venv, files and shell (MCP on :8770).
  # Register http://workbench-1:8770/mcp in the UI (Settings -> Tools), tick it on the
  # agent that owns it, and keep "Prefix tool names" on if an agent has more than one.
  # Copy this block (workbench-2 and its own volume) for each agent that needs one.
  #
  # Network: OFF by default. It's only on the internal "workbench" network, which has no
  # route out; the egress proxy lets it reach PyPI for pip installs and nothing else.
  # To give it full network access (internet and LAN), add "default" to its networks.
  workbench-1:
    build: ./workbench
    restart: unless-stopped
    networks: [workbench]
    volumes: ["workbench-1:/work"]   # files, the venv (/work/.venv) and saved scripts
    environment:
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
    read_only: true                  # only /work and /tmp are writable
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 2g
    pids_limit: 512

  # The workbenches' only way out: an allowlisting proxy (PyPI by default). Edit
  # deploy/egress/allowlist and `docker compose restart egress` to allow other hosts.
  egress:
    build: ./deploy/egress
    restart: unless-stopped
    networks: [default, workbench]
    volumes: ["./deploy/egress/allowlist:/etc/tinyproxy/allowlist:ro"]
    read_only: true
    tmpfs: ["/tmp", "/run", "/var/log/tinyproxy"]

volumes:
  hq-data:
  caddy-data:
  caddy-config:
  workbench-1:

networks:
  default:
  # Internal: containers on only this network can't reach the internet or your LAN.
  workbench:
    internal: true
